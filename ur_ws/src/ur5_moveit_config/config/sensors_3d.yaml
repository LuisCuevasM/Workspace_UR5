sensors:
  - default_sensor
default_sensor:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /octomap/home_scene_cloud
  max_range: 2.5
  max_update_rate: 1.0
  padding_offset: 0.01
  padding_scale: 1.0
  point_subsample: 1
  filtered_cloud_topic: "filtered_cloud"

octomap_resolution: 0.01
octomap_frame: base_link
