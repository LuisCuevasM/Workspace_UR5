# This is an example configuration file for the controller_manager node.
# YOU CAN NOT USE IT IN YOUR APPLICATION WITHOUT CHANGES
/**:
  controller_manager:
    ros__parameters:
      update_rate: 10

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      gripper_action_controller:
        type: position_controllers/GripperActionController

      gripper_velocity_controller:
        type: forward_command_controller/ForwardCommandController

      gripper_force_controller:
        type: forward_command_controller/ForwardCommandController


  gripper_action_controller:
    ros__parameters:
      action_monitor_rate: 20.0
      joint: robotiq_hande_left_finger_joint
      max_effort: 10.0
      goal_tolerance: 0.01
      allow_stalling: false
      stall_velocity_threshold: 0.001
      stall_timeout: 1.0
      state_interfaces:
        - position

  gripper_velocity_controller:
    ros__parameters:
      joints:
        - robotiq_hande_left_finger_joint
      interface_name: velocity

  gripper_force_controller:
    ros__parameters:
      joints:
        - robotiq_hande_left_finger_joint
      interface_name: effort
